# A string used to distinguish different Supabase projects on the same host. Defaults to the working directory name.
project_id = "vct-connect"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
